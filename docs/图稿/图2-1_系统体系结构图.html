<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图 2-1 系统体系结构图</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --font-sans: 'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', 'Songti SC', 'SimSun', serif;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-sans); font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.18em; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.2; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 980px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ARCHITECTURE · 电子相册系统 · DIAGRAM DESIGN</p>
    <h1>图 2-1 系统体系结构图</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 980 624" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig2-1_architecture-title fig2-1_architecture-desc">
        <title id="fig2-1_architecture-title">图 2-1 系统体系结构图</title>
        <desc id="fig2-1_architecture-desc">电子相册系统的三层体系结构：浏览器客户端经 HTTP 访问 FastAPI 服务器的控制器层，控制器调度模型层完成业务与数据访问，模型层连接 PostgreSQL 数据库与本机照片文件存储。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
          <marker id="tri" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/></marker>
          <marker id="tri-d" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" stroke-dasharray="2,1"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <g>
        <rect x="40" y="168" width="520" height="292" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="52" y="172" width="212" height="16" rx="2" fill="#f5f5f5"/>
        <path d="M 320,104 L 320,232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 320,428 L 320,520" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 520,390 L 592.0,390.0 Q 600,390 600.0,382.0 L 600.0,246.0 Q 600,238 608.0,238.0 L 640,238" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 790,276 L 790,352" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="80" y="232" width="440" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="232" width="440" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300.0" y="267" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">Controller 层（FastAPI 路由）</text>
        <text x="300.0" y="283" fill="#4f5d75" font-size="10" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">接收并校验请求 → 调度业务 → 返回 JSON</text>
        <rect x="80" y="352" width="440" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="352" width="440" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300.0" y="387" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">Model 层（业务逻辑 + 数据访问）</text>
        <text x="300.0" y="403" fill="#4f5d75" font-size="10" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">Pydantic 数据模型 · 业务规则 · SQLAlchemy 操作数据库</text>
        <rect x="160" y="40" width="320" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="40" width="320" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320.0" y="69" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">客户端：浏览器（Vue 3 + TypeScript）</text>
        <text x="320.0" y="85" fill="#4f5d75" font-size="10" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">普通用户 / 管理员的操作入口</text>
        <rect x="160" y="520" width="320" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="520" width="320" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="320.0" y="549" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">数据库（PostgreSQL · Docker 容器）</text>
        <text x="320.0" y="565" fill="#4f5d75" font-size="10" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">用户 / 相册 / 照片信息 / 评论 / 相册类别</text>
        <rect x="640" y="200" width="300" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="640" y="200" width="300" height="76" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="790.0" y="235" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">照片文件存储（前期）</text>
        <text x="790.0" y="251" fill="#4f5d75" font-size="10" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">本机 uploads/ 目录（文件系统）· 数据库只存路径与元数据</text>
        <rect x="640" y="352" width="300" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="640" y="352" width="300" height="60" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="790.0" y="379" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">照片文件存储（后期 · 待定）</text>
        <text x="790.0" y="395" fill="#4f5d75" font-size="10" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">独立文件服务器 / 对象存储</text>
        <rect x="640" y="470" width="300" height="108" rx="6" fill="#f5f5f5"/>
        <rect x="640" y="470" width="300" height="108" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="790.0" y="502" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">MVC 对应关系</text>
        <text x="790.0" y="519" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">V = 浏览器中的 Vue 页面</text>
        <text x="790.0" y="536" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">C = FastAPI 路由层</text>
        <text x="790.0" y="553" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">M = 业务逻辑与数据访问层</text>
        <text x="158.0" y="184" fill="#5a6580" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" letter-spacing="0.12em">Web 服务器（FastAPI + Uvicorn）</text>
        <rect x="336" y="159" width="148" height="20" rx="2" fill="#f5f5f5"/>
        <text x="336" y="172" fill="#5a6580" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="start">HTTP 请求 / JSON 响应</text>
        <rect x="336" y="463" width="156" height="20" rx="2" fill="#f5f5f5"/>
        <text x="336" y="476" fill="#5a6580" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="start">SQL 查询（SQLAlchemy）</text>
        <rect x="612" y="303" width="60" height="20" rx="2" fill="#f5f5f5"/>
        <text x="612" y="316" fill="#5a6580" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="start">文件读写</text>
        <rect x="806" y="305" width="84" height="20" rx="2" fill="#f5f5f5"/>
        <text x="806" y="318" fill="#5a6580" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="start">可视需求演进</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
