<svg xmlns="http://www.w3.org/2000/svg" width="928" height="437" viewBox="0 0 928 437" role="img" aria-labelledby="title desc"><title id="title">图 04 相册管理设计类图</title><desc id="desc">相册服务处理创建和修改，访问策略校验可见性或归属。类别服务删除前查询相册引用，数据库外键在并发写入时仍会阻止删除已被引用的类别。</desc><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#1F2A35"><polyline points="133,175 133,260" fill="none" stroke="#3D4145" stroke-width="1.15" stroke-dasharray="6,4"/><polyline points="136.8,251.0 133,260 129.2,251.0" fill="none" stroke="#3D4145" stroke-width="1.15"/><polyline points="425,54 824,54 824,79" fill="none" stroke="#3D4145" stroke-width="1.15" stroke-dasharray="6,4"/><polyline points="827.8,70.0 824,79 820.2,70.0" fill="none" stroke="#3D4145" stroke-width="1.15"/><polyline points="425,105 520,105" fill="none" stroke="#3D4145" stroke-width="1.15" stroke-dasharray="6,4"/><polyline points="511.0,101.2 520,105 511.0,108.8" fill="none" stroke="#3D4145" stroke-width="1.15"/><polyline points="425,304 478,304 478,196 555,196 555,128" fill="none" stroke="#3D4145" stroke-width="1.15" stroke-dasharray="6,4"/><polyline points="551.2,137.0 555,128 558.8,137.0" fill="none" stroke="#3D4145" stroke-width="1.15"/><polyline points="612,260 612,128" fill="none" stroke="#3D4145" stroke-width="1.15" stroke-dasharray="6,4"/><polyline points="608.2,137.0 612,128 615.8,137.0" fill="none" stroke="#3D4145" stroke-width="1.15"/><polyline points="824,260 824,128" fill="none" stroke="#3D4145" stroke-width="1.15" stroke-dasharray="6,4"/><polyline points="820.2,137.0 824,128 827.8,137.0" fill="none" stroke="#3D4145" stroke-width="1.15"/><rect x="24" y="24" width="401" height="151" fill="#FFFFFF" stroke="#3D4145" stroke-width="1.5"/><text x="195.99479166666666" y="41.4" font-size="13" font-weight="400" text-decoration="none">«service»</text><text x="165.66145833333334" y="61.6" font-size="17" font-weight="600" text-decoration="none">AlbumService</text><polyline points="24,7