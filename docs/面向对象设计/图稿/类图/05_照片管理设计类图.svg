<svg xmlns="http://www.w3.org/2000/svg" width="872" height="530" viewBox="0 0 872 530" role="img" aria-labelledby="title desc"><title id="title">图 05 照片管理设计类图</title><desc id="desc">照片服务通过访问策略检查相册权限。上传时由照片服务生成缩略图，由其持有的本地存储对象保存原图和缩略图。</desc><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#1F2A35"><polyline points="564,74 664,74" fill="none" stroke="#3D4145" stroke-width="1.15" stroke-dasharray="6,4"/><polyline points="655.0,70.2 664,74 655.0,77.8" fill="none" stroke="#3D4145" stroke-width="1.15"/><polyline points="136,198 136,280" fill="none" stroke="#3D4145" stroke-width="1.15" stroke-dasharray="6,4"/><polyline points="139.8,271.0 136,280 132.2,271.0" fill="none" stroke="#3D4145" stroke-width="1.15"/><polyline points="24,161 12,161 12,480 29,480" fill="none" stroke="#3D4145" stroke-width="1.15" stroke-dasharray="6,4"/><polyline points="20.0,476.2 29,480 20.0,483.8" fill="none" stroke="#3D4145" stroke-width="1.15"/><polyline points="451,198 451,430 329,430 329,455" fill="none" stroke="#3D4145" stroke-width="1.15" stroke-dasharray="6,4"/><polyline points="332.8,446.0 329,455 325.2,446.0" fill="none" stroke="#3D4145" stroke-width="1.15"/><polyline points="564,150 843,150 843,480 633,480" fill="none" stroke="#3D4145" stroke-width="1.15" stroke-dasharray="6,4"/><polyline points="642.0,483.8 633,480 642.0,476.2" fill="none" stroke="#3D4145" stroke-width="1.15"/><polyline points="524,198 524,280" fill="none" stroke="#3D4145" stroke-width="1.15"/><polyline points="527.8,271.0 524,280 520.2,271.0" fill="none" stroke="#3D4145" stroke-width="1.15"/><rect x="531.5" y="248" width="63" height="22" fill="#FFFFFF"/><text x="537.6666666666666" y="263.2" font-size="14" font-weight="400" text-decoration="none">storage</text><rect x="24" y="24" width="540" height="174" fill="#FFFFFF" stroke="#3D4145" stroke-width="1.5"/><text x="265.49479166666663" y="41.4" font-size="13" font-weight="400" text-decoration="none">«service»</text><text x="237.49479166666666" y="61.6" font-size="17" font-weight="600" text-decoration="none">PhotoService</text><polyline points="24,73 564,73" fill="none" stroke="#3D4145" stroke-width="1.15"/><text x="37" y="93.5" font-size="15" font-weight="400" text-decoration="none">+ upload(actor, album_id, file, upload_id) → tuple[Photo, bool]</text><text x="37" y="116.5" font-size="15" font-weight="400" text-decoration="none">+ list_photos(actor, album_id) → list[Photo]</text><text x="37" y="139.5" font-size="15" font-weight="400" text-decoration="none">+ get_detail(actor, photo_id) → PhotoDetail</text><text x="37" y="162.5" font-size="15" font-weight="400" text-decoration="none">+ open_image(actor, photo_id, variant) → ImageStream</text><text x="37" y="185.5" font-size="15" font-weight="400" text-decoration="none">- make_thumbnail(file)</text><rect x="664" y="49" width="160" height="49" fill="#FFFFFF" stroke="#3D4145" stroke-width="1.5"/><text x="718.8333333333334" y="66.4" font-size="13" font-weight="400" text-decoration="none">«entity»</text><text x="718.0" y="86.6" font-size="17" font-weight="600" text-decoration="none">Photo</text><rect x="24" y="280" width="402" height="105" fill="#FFFFFF" stroke="#3D4145" stroke-width="1.5"/><text x="199.16666666666666" y="297.4" font-size="13" font-weight="400" text-decoration="none">«policy»</text><text x="142.83854166666669" y="317.6" font-size="17" font-weight="600" text-decoration="none">AlbumAccessPolicy</text><polyline points="24,329 426,329" fill="none" stroke="#3D4145" stroke-width="1.15"/><text x="37" y="349.5" font-size="15" font-weight="400" text-decoration="none">+ require_visible(actor, album_id) → Album</text><text x="37" y="372.5" font-size="15" font-weight="400" text-decoration="none">+ require_owned(actor, album_id) → Album</text><rect x="475" y="280" width="349" height="128" fill="#FFFFFF" stroke="#3D4145" stroke-width="1.5"/><text x="618.5" y="297.4" font-size="13" font-weight="400" text-decoration="none