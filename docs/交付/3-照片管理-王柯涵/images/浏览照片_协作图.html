<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>浏览照片协作图</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --font-sans: 'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', 'Songti SC', 'SimSun', serif;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-sans); font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.18em; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.2; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1356px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">COLLABORATION · 浏览照片</p>
    <h1>浏览照片协作图</h1>
    <div class="diagram-container">

        <title id="浏览照片_协作图-title">浏览照片协作图</title>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
          <marker id="tri" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/></marker>
          <marker id="tri-d" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" stroke-dasharray="2,1"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <g transform="translate(-24,-100)">
        <path d="M 110,240 L 280,240" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 110,290 L 280,290" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 110,340 L 280,340" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 480,200 L 700,200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <path d="M 920,430 L 1140,430" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 1140,456 L 920,456" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <g stroke="#2d3142" stroke-width="1.2" fill="none" stroke-linecap="round"><circle cx="80" cy="248" r="7" fill="#ffffff"/><line x1="80" y1="255" x2="80" y2="280"/><line x1="69" y1="264" x2="91" y2="264"/><line x1="80" y1="280" x2="71" y2="298"/><line x1="80" y1="280" x2="89" y2="298"/></g>
        <text x="80" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">用户</text>
        <rect x="280" y="160" width="200" height="320" rx="6" fill="#f5f5f5"/>
        <rect x="280" y="160" width="200" height="320" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="380.0" y="325" fill="#2d3142" font-size="13" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">浏览页面</text>

        <rect x="504" y="397" width="172" height="20" rx="2" fill="#f5f5f5"/>
        <text x="590" y="410" fill="#2d3142" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">15: 返回并显示照片大图与信息</text>
        <rect x="980" y="175" width="100" height="20" rx="2" fill="#f5f5f5"/>
        <text x="1030" y="188" fill="#2d3142" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">3: 查询可见相册</text>
        <rect x="980" y="231" width="100" height="20" rx="2" fill="#f5f5f5"/>
        <text x="1030" y="244" fill="#2d3142" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">4: 返回相册列表</text>
        <rect x="974" y="261" width="112" height="20" rx="2" fill="#f5f5f5"/>

        <rect x="980" y="317" width="100" height="20" rx="2" fill="#f5f5f5"/>
        <text x="1030" y="330" fill="#2d3142" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">9: 返回照片列表</text>
        <rect x="976" y="405" width="108" height="20" rx="2" fill="#f5f5f5"/>
        <text x="1030" y="418" fill="#2d3142" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">13: 读取照片详情</text>
        <rect x="976" y="461" width="108" height="20" rx="2" fill="#f5f5f5"/>
        <text x="1030" y="474" fill="#2d3142" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">14: 返回照片详情</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
