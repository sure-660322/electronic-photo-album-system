<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>浏览照片活动图</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --font-sans: 'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', 'Songti SC', 'SimSun', serif;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-sans); font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.18em; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.2; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 728px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">FLOWCHART · 浏览照片</p>
    <h1>浏览照片活动图</h1>
    <div class="diagram-container">

          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
          <marker id="tri" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/></marker>

        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <g transform="translate(-60,12)">

        <rect x="100" y="72" width="280" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

        <polygon points="240,104.0 340.0,174 240,244.0 140.0,174" fill="#f5f5f5"/>
        <polygon points="240,104.0 340.0,174 240,244.0 140.0,174" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="240" y="178" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">存在可见相册？</text>

        <text x="240" y="392" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">相册可查看？</text>
        <rect x="470" y="360" width="200" height="44" rx="6" fill="#f5f5f5"/>

        <rect x="100" y="500" width="280" height="44" rx="6" fill="#f5f5f5"/>
        <rect x="100" y="500" width="280" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="240.0" y="526" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">显示相册内照片缩略图网格</text>
        <rect x="100" y="584" width="280" height="44" rx="6" fill="#f5f5f5"/>
        <rect x="100" y="584" width="280" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="240.0" y="610" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">点击某张缩略图</text>
        <rect x="100" y="668" width="280" height="44" rx="6" fill="#f5f5f5"/>
        <rect x="100" y="668" width="280" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

        <circle cx="240" cy="764" r="10" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
        <circle cx="240" cy="764" r="5" fill="#2d3142"/>
        <rect x="192" y="241" width="28" height="20" rx="2" fill="#f5f5f5"/>
        <text x="220" y="254" fill="#5a6580" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="end">是</text>
        <rect x="192" y="453" width="28" height="20" rx="2" fill="#f5f5f5"/>
        <text x="220" y="466" fill="#5a6580" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="end">是</text>
        <rect x="386" y="149" width="28" height="20" rx="2" fill="#f5f5f5"/>

        <rect x="670" y="183" width="60" height="20" rx="2" fill="#f5f5f5"/>

        <rect x="386" y="363" width="28" height="20" rx="2" fill="#f5f5f5"/>
        <text x="400" y="376" fill="#5a6580" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">否</text>
        <rect x="438" y="63" width="84" height="20" rx="2" fill="#f5f5f5"/>
        <text x="480" y="76" fill="#5a6580" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">返回相册列表</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
