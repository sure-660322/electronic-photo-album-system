<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上传图片活动图</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --font-sans: 'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', 'Songti SC', 'SimSun', serif;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-sans); font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.18em; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.2; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 676px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">FLOWCHART · 上传图片</p>
    <h1>上传图片活动图</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 676 656" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="上传图片_活动图-title 上传图片_活动图-desc">
        <title id="上传图片_活动图-title">上传图片活动图</title>
        <desc id="上传图片_活动图-desc">上传图片的活动流程：进入相册点击上传、选择文件提交，校验格式与大小，不通过则提示并返回重新选择，通过后保存文件生成缩略图并记录上传信息。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
          <marker id="tri" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/></marker>
          <marker id="tri-d" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" stroke-dasharray="2,1"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <g transform="translate(-56,12)">
        <path d="M 240,44 L 240,72" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 240,116 L 240,148" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 240,192 L 240,224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 240,268 L 240,280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 240,372 L 240,420" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 240,464 L 240,504" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 240,548 L 240,582" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 350,326 L 460,326" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 576,294 L 576.0,256.0 Q 576,248 568.0,248.0 L 380,248" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <circle cx="240" cy="36" r="8" fill="#2d3142"/>
        <rect x="100" y="72" width="280" height="44" rx="6" fill="#f5f5f5"/>
        <rect x="100" y="72" width="280" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="240.0" y="98" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">进入目标相册，点击“上传图片”</text>
        <rect x="100" y="148" width="280" height="44" rx="6" fill="#f5f5f5"/>
        <rect x="100" y="148" width="280" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="240.0" y="174" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">系统显示文件选择窗口</text>
        <rect x="100" y="224" width="280" height="44" rx="6" fill="#f5f5f5"/>
        <rect x="100" y="224" width="280" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="240.0" y="250" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">选择本地图片文件并提交</text>
        <polygon points="240,238.0 350.0,326 240,414.0 130.0,326" fill="#f5f5f5"/>
        <polygon points="240,238.0 350.0,326 240,414.0 130.0,326" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="240" y="330" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">格式、大小校验通过？</text>
        <rect x="460" y="294" width="232" height="44" rx="6" fill="#f5f5f5"/>
        <rect x="460" y="294" width="232" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="576.0" y="311" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">提示“仅支持 jpg/png/gif，</text>
        <text x="576.0" y="329" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">且不超过 10MB”</text>
        <rect x="96" y="420" width="288" height="44" rx="6" fill="#f5f5f5"/>
        <rect x="96" y="420" width="288" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="240.0" y="446" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">保存图片文件并生成缩略图，记录上传者与上传时间</text>
        <rect x="100" y="504" width="280" height="44" rx="6" fill="#f5f5f5"/>
        <rect x="100" y="504" width="280" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="240.0" y="530" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">提示上传成功，照片显示在相册中</text>
        <circle cx="240" cy="592" r="10" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
        <circle cx="240" cy="592" r="5" fill="#2d3142"/>
        <rect x="192" y="385" width="28" height="20" rx="2" fill="#f5f5f5"/>
        <text x="220" y="398" fill="#5a6580" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="end">是</text>
        <rect x="386" y="301" width="28" height="20" rx="2" fill="#f5f5f5"/>
        <text x="400" y="314" fill="#5a6580" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">否</text>
        <rect x="436" y="223" width="84" height="20" rx="2" fill="#f5f5f5"/>
        <text x="478" y="236" fill="#5a6580" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">返回重新选择</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
