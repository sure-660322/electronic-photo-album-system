<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上传图片协作图</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --font-sans: 'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', 'Songti SC', 'SimSun', serif;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-sans); font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.18em; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.2; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">COLLABORATION · 上传图片</p>
    <h1>上传图片协作图</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 416" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="上传图片_协作图-title 上传图片_协作图-desc">
        <title id="上传图片_协作图-title">上传图片协作图</title>
        <desc id="上传图片_协作图-desc">上传图片过程中用户、上传页面、上传控制器、照片之间的八条消息：提交上传请求、保存并生成缩略图、返回结果、提示上传成功。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
          <marker id="tri" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/></marker>
          <marker id="tri-d" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" stroke-dasharray="2,1"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <g transform="translate(-16,-120)">
        <path d="M 110,210 L 280,210" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 280,244 L 110,244" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 110,296 L 280,296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 480,210 L 700,210" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 700,244 L 480,244" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 736,330 L 736,430" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 824,430 L 824,330" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 380,400 L 380.0,432.0 Q 380,440 372.0,440.0 L 72.0,440.0 Q 64,440 64.0,432.0 L 64.0,236.0 Q 64,230 70.0,230.0 L 76,230" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <g stroke="#2d3142" stroke-width="1.2" fill="none" stroke-linecap="round"><circle cx="80" cy="188" r="7" fill="#ffffff"/><line x1="80" y1="195" x2="80" y2="220"/><line x1="69" y1="204" x2="91" y2="204"/><line x1="80" y1="220" x2="71" y2="238"/><line x1="80" y1="220" x2="89" y2="238"/></g>
        <text x="80" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">用户</text>
        <rect x="280" y="160" width="200" height="240" rx="6" fill="#f5f5f5"/>
        <rect x="280" y="160" width="200" height="240" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="380.0" y="285" fill="#2d3142" font-size="13" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">上传页面</text>
        <rect x="700" y="160" width="200" height="170" rx="6" fill="#f5f5f5"/>
        <rect x="700" y="160" width="200" height="170" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="800.0" y="250" fill="#2d3142" font-size="13" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">上传控制器</text>
        <rect x="700" y="430" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="700" y="430" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="800.0" y="467" fill="#2d3142" font-size="13" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">照片</text>
        <rect x="108" y="185" width="168" height="20" rx="2" fill="#f5f5f5"/>
        <text x="192" y="198" fill="#2d3142" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">1: 进入相册，点击“上传图片”</text>
        <rect x="132" y="249" width="120" height="20" rx="2" fill="#f5f5f5"/>
        <text x="192" y="262" fill="#2d3142" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">2: 显示文件选择窗口</text>
        <rect x="126" y="271" width="132" height="20" rx="2" fill="#f5f5f5"/>
        <text x="192" y="284" fill="#2d3142" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">3: 选择图片文件并提交</text>
        <rect x="540" y="185" width="100" height="20" rx="2" fill="#f5f5f5"/>
        <text x="590" y="198" fill="#2d3142" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">4: 提交上传请求</text>
        <rect x="540" y="249" width="100" height="20" rx="2" fill="#f5f5f5"/>
        <text x="590" y="262" fill="#2d3142" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">7: 返回上传结果</text>
        <rect x="502" y="363" width="220" height="20" rx="2" fill="#f5f5f5"/>
        <text x="722" y="376" fill="#2d3142" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="end">5: 保存图片并生成缩略图，记录上传信息</text>
        <rect x="836" y="363" width="100" height="20" rx="2" fill="#f5f5f5"/>
        <text x="836" y="376" fill="#2d3142" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="start">6: 返回保存结果</text>
        <rect x="120" y="415" width="200" height="20" rx="2" fill="#f5f5f5"/>
        <text x="220" y="428" fill="#2d3142" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">8: 提示上传成功，照片显示在相册中</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
