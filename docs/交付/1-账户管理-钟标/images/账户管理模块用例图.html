<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>账户管理模块用例图</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --font-sans: 'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', 'Songti SC', 'SimSun', serif;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-sans); font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.18em; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.2; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 724px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">USE CASE · 账户管理模块</p>
    <h1>账户管理模块用例图</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 724 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="账户管理模块用例图-title 账户管理模块用例图-desc">
        <title id="账户管理模块用例图-title">账户管理模块用例图</title>
        <desc id="账户管理模块用例图-desc">账户管理模块的系统边界内包含用户注册、用户登录两个用例；普通用户参与两个用例，管理员账户由系统预置、只参与用户登录。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
          <marker id="tri" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/></marker>
          <marker id="tri-d" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" stroke-dasharray="2,1"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <g transform="translate(-56,0)">
        <rect x="220" y="40" width="520" height="400" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="232" y="44" width="84" height="16" rx="2" fill="#f5f5f5"/>
        <path d="M 124,160 L 392,160" fill="none" stroke="#2d3142" stroke-width="1.2"/>
        <path d="M 124,184 L 232.0,184.0 Q 240,184 240.0,192.0 L 240.0,288.0 Q 240,296 248.0,296.0 L 430,296" fill="none" stroke="#2d3142" stroke-width="1.2"/>
        <path d="M 124,320 L 392,320" fill="none" stroke="#2d3142" stroke-width="1.2"/>
        <ellipse cx="480" cy="160" rx="85.0" ry="28.0" fill="#f5f5f5"/>
        <ellipse cx="480" cy="160" rx="85.0" ry="28.0" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="164" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">用户注册</text>
        <ellipse cx="480" cy="320" rx="85.0" ry="28.0" fill="#f5f5f5"/>
        <ellipse cx="480" cy="320" rx="85.0" ry="28.0" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="324" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">用户登录</text>
        <g stroke="#2d3142" stroke-width="1.2" fill="none" stroke-linecap="round"><circle cx="110" cy="144" r="7" fill="#ffffff"/><line x1="110" y1="151" x2="110" y2="176"/><line x1="99" y1="160" x2="121" y2="160"/><line x1="110" y1="176" x2="101" y2="194"/><line x1="110" y1="176" x2="119" y2="194"/></g>
        <text x="110" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">普通用户</text>
        <g stroke="#2d3142" stroke-width="1.2" fill="none" stroke-linecap="round"><circle cx="110" cy="304" r="7" fill="#ffffff"/><line x1="110" y1="311" x2="110" y2="336"/><line x1="99" y1="320" x2="121" y2="320"/><line x1="110" y1="336" x2="101" y2="354"/><line x1="110" y1="336" x2="119" y2="354"/></g>
        <text x="110" y="372" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">管理员</text>
        <text x="274.0" y="56" fill="#5a6580" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle" letter-spacing="0.12em">电子相册系统</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
