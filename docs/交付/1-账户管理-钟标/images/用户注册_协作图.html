<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户注册协作图</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --font-sans: 'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', 'Songti SC', 'SimSun', serif;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-sans); font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.18em; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.2; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 916px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">COLLABORATION · 用户注册</p>
    <h1>用户注册协作图</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 916 376" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="用户注册_协作图-title 用户注册_协作图-desc">
        <title id="用户注册_协作图-title">用户注册协作图</title>
        <desc id="用户注册_协作图-desc">用户注册过程中访客、注册页面、注册控制器、用户实体之间的八条消息：输入提交、查重、创建账户、提示成功并跳转登录页。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
          <marker id="tri" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/></marker>
          <marker id="tri-d" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" stroke-dasharray="2,1"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <g transform="translate(-24,-44)">
        <path d="M 110,112 L 280,112" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 280,136 L 110,136" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 340,146 L 340,250" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 420,250 L 420,146" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 480,265 L 700,265" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 480,335 L 700,335" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 700,300 L 480,300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 700,370 L 480,370" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <g stroke="#2d3142" stroke-width="1.2" fill="none" stroke-linecap="round"><circle cx="80" cy="106" r="7" fill="#ffffff"/><line x1="80" y1="113" x2="80" y2="138"/><line x1="69" y1="122" x2="91" y2="122"/><line x1="80" y1="138" x2="71" y2="156"/><line x1="80" y1="138" x2="89" y2="156"/></g>
        <text x="80" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">访客</text>
        <rect x="280" y="90" width="200" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="280" y="90" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="380.0" y="123" fill="#2d3142" font-size="13" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">注册页面</text>
        <rect x="280" y="250" width="200" height="130" rx="6" fill="#f5f5f5"/>
        <rect x="280" y="250" width="200" height="130" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="380.0" y="320" fill="#2d3142" font-size="13" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">注册控制器</text>
        <rect x="700" y="250" width="200" height="130" rx="6" fill="#f5f5f5"/>
        <rect x="700" y="250" width="200" height="130" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="800.0" y="320" fill="#2d3142" font-size="13" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">用户</text>
        <rect x="142" y="87" width="100" height="20" rx="2" fill="#f5f5f5"/>
        <text x="192" y="100" fill="#2d3142" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">1: 输入注册信息</text>
        <rect x="148" y="141" width="88" height="20" rx="2" fill="#f5f5f5"/>
        <text x="192" y="154" fill="#2d3142" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">8: 跳转登录页</text>
        <rect x="228" y="187" width="100" height="20" rx="2" fill="#f5f5f5"/>
        <text x="328" y="200" fill="#2d3142" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="end">2: 提交注册请求</text>
        <rect x="432" y="187" width="100" height="20" rx="2" fill="#f5f5f5"/>
        <text x="432" y="200" fill="#2d3142" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="start">7: 提示注册成功</text>
        <rect x="546" y="240" width="88" height="20" rx="2" fill="#f5f5f5"/>
        <text x="590" y="253" fill="#2d3142" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">3: 检查用户名</text>
        <rect x="546" y="310" width="88" height="20" rx="2" fill="#f5f5f5"/>
        <text x="590" y="323" fill="#2d3142" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">5: 创建新账户</text>
        <rect x="540" y="275" width="100" height="20" rx="2" fill="#f5f5f5"/>
        <text x="590" y="288" fill="#2d3142" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">4: 返回检查结果</text>
        <rect x="540" y="345" width="100" height="20" rx="2" fill="#f5f5f5"/>
        <text x="590" y="358" fill="#2d3142" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">6: 返回创建结果</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
