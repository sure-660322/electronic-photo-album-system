<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>相册管理协作图</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --font-sans: 'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', 'Songti SC', 'SimSun', serif;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-sans); font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.18em; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.2; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 892px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">COLLABORATION · 相册管理</p>
    <h1>相册管理协作图</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 892 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="相册管理_协作图-title 相册管理_协作图-desc">
        <title id="相册管理_协作图-title">相册管理协作图</title>
        <desc id="相册管理_协作图-desc">创建相册过程中用户、相册页面、相册控制器、相册实体之间的六条消息：输入提交、查重、保存、返回结果、显示成功并刷新列表。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
          <marker id="tri" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/></marker>
          <marker id="tri-d" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" stroke-dasharray="2,1"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <g transform="translate(-24,-32)">
        <path d="M 110,98 L 280,98" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 280,124 L 110,124" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 480,98 L 640,98" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 640,124 L 480,124" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 676,136 L 676,370" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 764,370 L 764,136" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <g stroke="#2d3142" stroke-width="1.2" fill="none" stroke-linecap="round"><circle cx="80" cy="96" r="7" fill="#ffffff"/><line x1="80" y1="103" x2="80" y2="128"/><line x1="69" y1="112" x2="91" y2="112"/><line x1="80" y1="128" x2="71" y2="146"/><line x1="80" y1="128" x2="89" y2="146"/></g>
        <text x="80" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">用户</text>
        <rect x="280" y="80" width="200" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="280" y="80" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="380.0" y="113" fill="#2d3142" font-size="13" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">相册页面</text>
        <rect x="640" y="80" width="200" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="640" y="80" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="740.0" y="113" fill="#2d3142" font-size="13" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">相册控制器</text>
        <rect x="640" y="370" width="200" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="640" y="370" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="740.0" y="403" fill="#2d3142" font-size="13" font-weight="500" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">相册</text>
        <rect x="104" y="73" width="176" height="20" rx="2" fill="#f5f5f5"/>
        <text x="192" y="86" fill="#2d3142" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">1: 输入相册名称、描述与可见性</text>
        <rect x="114" y="129" width="156" height="20" rx="2" fill="#f5f5f5"/>
        <text x="192" y="142" fill="#2d3142" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">6: 显示创建成功并刷新列表</text>
        <rect x="500" y="73" width="120" height="20" rx="2" fill="#f5f5f5"/>
        <text x="560" y="86" fill="#2d3142" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">2: 提交创建相册请求</text>
        <rect x="510" y="129" width="100" height="20" rx="2" fill="#f5f5f5"/>
        <text x="560" y="142" fill="#2d3142" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">5: 返回创建结果</text>
        <rect x="552" y="239" width="112" height="20" rx="2" fill="#f5f5f5"/>
        <text x="664" y="252" fill="#2d3142" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="end">3: 检查名称唯一性</text>
        <rect x="776" y="239" width="100" height="20" rx="2" fill="#f5f5f5"/>
        <text x="776" y="252" fill="#2d3142" font-size="11" font-family="'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="start">4: 保存相册数据</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
